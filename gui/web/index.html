<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The theme is owned by src/theme.css, which declares color-scheme on :root.
      This meta tag only tells the browser both themes are supported before CSS
      arrives, so the very first paint does not flash the wrong chrome.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>ReTrain — local training console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
